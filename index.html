<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BANANA ROOM</title>
  <link href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css" rel="stylesheet">
  <style>
    :root {
      --pink1: #e8547a;
      --pink2: #ff8fab;
      --pink3: #ffb3c6;
      --pink4: #ffd6e7;
      --pink5: #fff0f6;
      --text1: #7a1a3e;
      --text2: #b06080;
      --white: #ffffff;
      --shadow: rgba(232,84,122,0.22);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background:
        radial-gradient(ellipse 120% 60% at 50% 0%,   #b8f5f5 0%, transparent 65%),
        radial-gradient(ellipse 80%  40% at 80% 20%,  #d8fafa 0%, transparent 55%),
        linear-gradient(180deg,
          #c5f5f5 0%, #d8fafa 18%,
          #fce8f2 42%, #ffd4e8 62%,
          #ffdce9 82%, #ffcee2 100%);
      font-family: 'Galmuri11', 'MS Sans Serif', sans-serif;
      font-size: 11px;
      color: var(--text1);
      cursor: none;
      user-select: none;
    }

    /* ── 로딩 오버레이 ── */
    #loading-overlay {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(180deg, #ffdded 0%, #fff0f6 50%, #ffe8c8 100%);
      transition: opacity 0.6s ease;
    }
    #loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .load-win {
      width: 380px; background: var(--pink5);
      border: 2px solid var(--pink1);
      box-shadow: 4px 4px 0 var(--shadow);
    }
    .load-bar-bg {
      flex: 1; height: 14px; background: var(--white);
      border: 1px solid var(--pink1);
    }
    .load-bar-fill {
      height: 100%;
      background: linear-gradient(to right, var(--pink3), var(--pink2));
      width: 0%; transition: width 0.08s linear;
    }

    /* ── 커서 / 스파클 ── */
    #cursor {
      position: fixed; font-size: 14px;
      pointer-events: none; z-index: 9998;
      transform: translate(-50%, -50%);
    }
    .sparkle {
      position: fixed; pointer-events: none; z-index: 9997;
      font-size: 10px; animation: sp 0.7s ease-out forwards;
    }
    @keyframes sp {
      from { opacity: 1; transform: translateY(0) scale(1); }
      to   { opacity: 0; transform: translateY(-20px) scale(0.2); }
    }

    /* ── 데스크탑 아이콘 ── */
    .icon-grid {
      position: fixed; left: 16px; top: 40px;
      display: flex; flex-direction: column; gap: 6px;
      z-index: 5;
    }
    .desktop-icon {
      display: flex; flex-direction: column;
      align-items: center; width: 68px; padding: 5px 4px 4px;
      cursor: default; gap: 4px;
    }
    .desktop-icon:hover  { background: rgba(255,143,171,0.30); outline: 1px dotted var(--pink2); }
    .desktop-icon.active { background: rgba(255,143,171,0.50); outline: 1px dotted var(--pink1); }
    .desktop-icon img {
      width: 32px; height: 32px;
      image-rendering: pixelated;
      filter: sepia(0.3) hue-rotate(280deg) saturate(1.5);
    }
    .desktop-icon span {
      font-size: 10px; color: #fff; text-align: center; line-height: 1.3;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.7), -1px -1px 1px rgba(0,0,0,0.4);
    }

    /* ── 공통 윈도우 ── */
    .win {
      position: fixed; background: var(--pink5);
      border: 2px solid var(--pink1);
      box-shadow: 4px 4px 0 var(--shadow), 0 0 0 1px var(--pink3);
      z-index: 10;
      display: none;
    }
    .win.open { display: block; }
    .win-title {
      background: linear-gradient(to right, var(--pink2), var(--pink3), var(--pink2));
      color: var(--text1);
      padding: 3px 4px 3px 7px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--pink1);
      cursor: move;
    }
    .win-label {
      font-size: 11px; font-weight: bold;
      display: flex; align-items: center; gap: 5px;
      pointer-events: none;
    }
    .win-btns { display: flex; gap: 3px; cursor: default; }
    .tbtn {
      width: 18px; height: 14px;
      background: var(--pink5); border: 1px solid var(--pink1);
      font-size: 9px; font-family: inherit; color: var(--text1);
      display: flex; align-items: center; justify-content: center;
      cursor: default;
    }
    .tbtn:hover  { background: var(--pink3); }
    .tbtn:active { background: var(--pink4); }
    .win-body {
      padding: 8px; background: var(--white);
      overflow: auto;
    }
    .win-menubar {
      background: var(--pink4); border-bottom: 1px solid var(--pink3);
      padding: 2px 4px; display: flex; gap: 1px;
    }
    .mitem {
      padding: 2px 8px; cursor: default; color: var(--text1);
    }
    .mitem:hover { background: var(--pink2); color: var(--white); }
    .menu { position: relative; }
    .mitem { border: 0; background: transparent; font: inherit; }
    .menu-dropdown {
      position: absolute; top: 100%; left: 0; z-index: 20; min-width: 84px;
      padding: 2px; border: 1px solid var(--pink1); background: var(--white);
      box-shadow: 2px 2px 0 var(--shadow);
    }
    .menu-dropdown button { width: 100%; padding: 3px 7px; border: 0; background: transparent; color: var(--text1); font: inherit; text-align: left; }
    .menu-dropdown button:hover { background: var(--pink2); color: var(--white); }

    /* ── 픽셀 아이콘 (윈도우 내부) ── */
    .px-icon {
      width: 16px; height: 16px;
      image-rendering: pixelated; vertical-align: middle;
      margin-right: 3px; flex-shrink: 0;
      filter: sepia(0.3) hue-rotate(280deg) saturate(1.5);
    }

    /* ── 프로필 윈도우 ── */
    #win-profile { width: 170px; transition: width 0.18s ease; }
    #win-profile.editing { width: 390px; }
    .profile-layout { display: flex; align-items: flex-start; gap: 10px; }
    .profile-summary { width: 150px; flex: 0 0 150px; }
    .avatar {
      display: block; width: 56px; height: 56px;
      margin: 6px auto 7px;
      border: 2px solid var(--pink1);
      background: var(--pink4);
      font-size: 26px; line-height: 52px; text-align: center;
      box-shadow: 2px 2px 0 var(--shadow);
    }
    .avatar img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .avatar img[hidden] { display: none; }
    .pname { text-align: center; font-weight: bold; color: var(--text1); }
    .pstat { text-align: center; font-size: 10px; color: var(--text2); margin-top: 2px; }
    .pinfo {
      margin-top: 7px; padding-top: 6px;
      border-top: 1px solid var(--pink4);
      font-size: 10px; color: var(--text2); line-height: 2;
    }
    .profile-auth, .profile-editor { margin-top: 8px; text-align: left; }
    .profile-auth button, .profile-editor button {
      width: 100%; padding: 4px 6px; border: 1px solid var(--pink1);
      background: var(--pink4); color: var(--text1); font: inherit; cursor: pointer;
    }
    .profile-auth button:hover, .profile-editor button:hover { background: var(--pink3); }
    .profile-auth-status { margin-top: 4px; font-size: 9px; color: var(--text2); text-align: center; word-break: break-all; }
    .profile-editor {
      flex: 1; min-width: 0; margin-top: 0;
      border-left: 1px solid var(--pink4); padding: 0 0 0 10px;
    }
    .profile-editor label { display: block; margin: 4px 0 2px; font-size: 9px; color: var(--text2); }
    .profile-editor input, .profile-editor textarea {
      width: 100%; border: 1px solid var(--pink3); padding: 3px; font: inherit; color: var(--text1);
    }
    .profile-editor textarea { height: 42px; resize: vertical; }
    .profile-editor[hidden] { display: none; }
    .profile-image-preview {
      display: block; width: 100%; height: 72px; margin-top: 5px;
      border: 1px solid var(--pink3); object-fit: cover; background: var(--pink5);
    }
    .profile-image-preview[hidden] { display: none; }
    .profile-editor-actions { display: flex; gap: 4px; margin-top: 7px; }
    .profile-editor-actions button { width: auto; flex: 1; }

    /* ── 시계 윈도우 ── */
    #win-clock { width: 170px; }
    #clock {
      font-family: 'Courier New', monospace;
      font-size: 18px; text-align: center;
      letter-spacing: 2px; color: var(--text1); font-weight: bold;
      padding: 4px 0;
    }
    #date-disp {
      font-size: 9px; text-align: center;
      color: var(--text2); margin-top: 2px; padding-bottom: 2px;
    }

    /* ── 홈 윈도우 ── */
    #win-welcome { width: 370px; }
    .welcome-box {
      border: 1px solid var(--pink3);
      padding: 14px; text-align: center;
      background: linear-gradient(135deg, var(--white) 0%, var(--pink4) 100%);
      position: relative; overflow: hidden;
    }
    .welcome-box::before {
      content: '♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡';
      position: absolute; top: 4px; left: 0; right: 0;
      font-size: 9px; color: var(--pink3); letter-spacing: 6px;
      white-space: nowrap; overflow: hidden; pointer-events: none;
    }
    .welcome-box::after {
      content: '♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡ ♡';
      position: absolute; bottom: 4px; left: 0; right: 0;
      font-size: 9px; color: var(--pink3); letter-spacing: 6px;
      white-space: nowrap; overflow: hidden; pointer-events: none;
    }
    .welcome-box .big { font-size: 13px; font-weight: bold; color: var(--pink1); }
    .welcome-box p { font-size: 11px; color: var(--text2); line-height: 2; margin-top: 6px; }
    .welcome-editor { margin-top: 9px; text-align: left; }
    .welcome-editor label { display: block; margin: 5px 0 2px; font-size: 10px; color: var(--text2); }
    .welcome-editor input, .welcome-editor textarea {
      width: 100%; padding: 4px; border: 1px solid var(--pink3); color: var(--text1); font: inherit;
    }
    .welcome-editor textarea { height: 72px; resize: vertical; }
    .welcome-editor-actions { display: flex; gap: 4px; margin-top: 7px; }
    .welcome-editor-actions button { flex: 1; padding: 4px; border: 1px solid var(--pink1); background: var(--pink4); color: var(--text1); font: inherit; }
    .welcome-editor-actions button:hover { background: var(--pink3); }

    /* ── 다이어리 윈도우 ── */
    #win-diary { width: 600px; }
    .diary-layout { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 12px; }
    .diary-calendar { border-right: 1px solid var(--pink4); padding-right: 12px; }
    .diary-calendar-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; font-size: 10px; color: var(--text1); }
    .diary-calendar-header button { width: 20px; border: 1px solid var(--pink3); background: var(--pink5); color: var(--text1); font: inherit; cursor: pointer; }
    .diary-calendar-week, .diary-calendar-days { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
    .diary-calendar-week { color: var(--text2); font-size: 9px; margin-bottom: 2px; }
    .diary-calendar-day { position: relative; min-height: 23px; border: 0; border-radius: 2px; background: transparent; color: var(--text1); font: inherit; cursor: pointer; }
    .diary-calendar-day:hover, .diary-calendar-day.selected { background: var(--pink4); }
    .diary-calendar-day.muted { color: var(--pink3); cursor: default; }
    .diary-calendar-day.has-entry::after { content: ''; position: absolute; width: 4px; height: 4px; left: calc(50% - 2px); bottom: 2px; border-radius: 50%; background: var(--pink1); }
    .diary-date {
      font-size: 10px; color: var(--text2);
      border-bottom: 1px solid var(--pink4);
      padding-bottom: 5px; margin-bottom: 9px;
    }
    .diary-body { font-size: 11px; line-height: 2.2; color: var(--text1); }
    .diary-empty { color: var(--text2); }
    .diary-editor { margin-top: 9px; }
    .diary-editor label { display: block; margin: 5px 0 2px; font-size: 10px; color: var(--text2); }
    .diary-editor input, .diary-editor select, .diary-editor textarea { width: 100%; padding: 4px; border: 1px solid var(--pink3); color: var(--text1); font: inherit; }
    .diary-editor textarea { height: 105px; resize: vertical; }
    .diary-editor-actions { display: flex; gap: 4px; margin-top: 7px; }
    .diary-editor-actions button { flex: 1; padding: 4px; border: 1px solid var(--pink1); background: var(--pink4); color: var(--text1); font: inherit; cursor: pointer; }
    .diary-editor-actions button:hover { background: var(--pink3); }
    .memo-deco {
      float: right; margin: 0 0 6px 12px;
      image-rendering: pixelated; width: 72px;
      filter: sepia(0.2) hue-rotate(280deg) saturate(1.3);
    }

    /* ── 깜빡임 ── */
    .blink { animation: bl 1s step-start infinite; }
    @keyframes bl { 50% { opacity: 0; } }

    /* ── 토스트 알림 ── */
    #toast {
      position: fixed; bottom: 50px; left: 50%;
      transform: translateX(-50%);
      background: var(--pink5); border: 2px solid var(--pink1);
      padding: 6px 18px; font-size: 11px; color: var(--text1);
      box-shadow: 3px 3px 0 var(--shadow);
      z-index: 9000; opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    #toast.show { opacity: 1; }

    /* ── 태스크바 ── */
    .taskbar {
      position: fixed; bottom: 0; left: 0; right: 0; height: 28px;
      background: linear-gradient(to bottom, var(--pink3), var(--pink4));
      border-top: 2px solid var(--pink2);
      display: flex; align-items: center; gap: 4px;
      padding: 0 4px; z-index: 100;
    }
    .start-btn {
      background: linear-gradient(to bottom, var(--pink5), var(--pink4));
      border: 1px solid var(--pink1); font-family: inherit;
      font-size: 11px; font-weight: bold; padding: 2px 10px;
      cursor: default; color: var(--text1);
      flex-shrink: 0;
    }
    .start-btn:active { background: var(--pink3); }
    .start-menu {
      position: fixed; left: 4px; bottom: 28px; z-index: 101;
      min-width: 130px; padding: 4px; border: 2px solid var(--pink1);
      background: var(--pink5); box-shadow: 3px 3px 0 var(--shadow);
    }
    .start-menu button {
      width: 100%; padding: 5px 7px; border: 0; background: transparent;
      color: var(--text1); font: inherit; text-align: left; cursor: default;
    }
    .start-menu button:hover { background: var(--pink2); color: var(--white); }
    .tb-sep { width: 1px; background: var(--pink2); height: 18px; flex-shrink: 0; }
    .tb-wins { display: flex; gap: 3px; flex: 1; overflow: hidden; }
    .tb-win {
      background: linear-gradient(to bottom, var(--pink4), var(--pink3));
      border: 1px solid var(--pink2); font-family: inherit;
      font-size: 10px; color: var(--text1);
      padding: 1px 8px; cursor: default;
      white-space: nowrap; min-width: 0;
    }
    .tb-win:hover { background: var(--pink3); }
    .tb-win.active {
      background: linear-gradient(to bottom, var(--pink2), var(--pink3));
      font-weight: bold;
      border-color: var(--pink1);
    }
    .tb-clock {
      background: var(--pink5); border: 1px solid var(--pink2);
      padding: 2px 8px; font-family: 'Courier New', monospace;
      font-size: 11px; color: var(--text1); flex-shrink: 0;
    }
  </style>
</head>
<body>

<!-- ── 로딩 오버레이 ── -->
<div id="loading-overlay">
  <div class="load-win">
    <div style="background:linear-gradient(to right,var(--pink2),var(--pink3),var(--pink2));padding:3px 7px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--pink1)">
      <span style="font-weight:bold;font-size:11px">🐰 BANANA ROOM</span>
      <div style="display:flex;gap:3px">
        <div class="tbtn">_</div><div class="tbtn">□</div><div class="tbtn">×</div>
      </div>
    </div>
    <div style="padding:24px 32px 28px;text-align:center;background:var(--white)">
      <div style="font-size:44px;margin-bottom:12px">🌸</div>
      <div style="font-size:13px;font-weight:bold;color:var(--pink1);letter-spacing:2px;margin-bottom:18px">BANANA ROOM</div>
      <div style="display:flex;align-items:center;gap:8px">
        <span id="load-pct" style="font-size:11px;color:var(--pink1);width:28px;text-align:right">0%</span>
        <div class="load-bar-bg"><div class="load-bar-fill" id="load-bar"></div></div>
      </div>
    </div>
  </div>
</div>

<!-- ── 커서 ── -->
<div id="cursor">✿</div>

<!-- ── 데스크탑 아이콘 GNB ── -->
<div class="icon-grid">
  <div class="desktop-icon" id="ico-home"      onclick="icoClick(this,'win-welcome')">
    <img src="assets/icons/file.png" alt=""><span>홈</span>
  </div>
  <div class="desktop-icon" id="ico-diary"     onclick="icoClick(this,'win-diary')">
    <img src="assets/icons/memo.png" alt=""><span>다이어리</span>
  </div>
  <div class="desktop-icon" id="ico-photos"    onclick="icoClick(this,null)">
    <img src="assets/icons/key.png" alt=""><span>사진첩</span>
  </div>
  <div class="desktop-icon" id="ico-guestbook" onclick="icoClick(this,null)">
    <img src="assets/icons/mail.png" alt=""><span>방명록</span>
  </div>
  <div class="desktop-icon" id="ico-profile"   onclick="icoClick(this,'win-profile')">
    <img src="assets/icons/warning.png" alt=""><span>프로필</span>
  </div>
</div>
<!-- ── 프로필 윈도우 ── -->
<div class="win open" id="win-profile">
  <div class="win-title" data-win="win-profile">
    <span class="win-label">🌸 프로필</span>
    <div class="win-btns">
      <button class="tbtn" onclick="minimizeWin('win-profile')">_</button>
      <button class="tbtn">□</button>
      <button class="tbtn" onclick="closeWin('win-profile')">×</button>
    </div>
  </div>
  <div class="win-body" style="text-align:center">
    <div class="profile-layout">
      <div class="profile-summary">
        <div class="avatar"><span id="profile-avatar-fallback">🌸</span><img id="profile-avatar-image" alt="프로필 사진" hidden></div>
        <div class="pname" id="profile-name">홈피 주인</div>
        <div class="pstat" id="profile-status">오늘도 반짝반짝 ♡</div>
        <div class="pinfo" id="profile-info">🌸 방문자: 1,234<br>♡ 친구: 12명<br>✦ 방명록: 56개</div>
        <div class="profile-auth">
          <button type="button" id="profile-edit" hidden>프로필 수정</button>
          <div class="profile-auth-status" id="profile-auth-status" hidden></div>
        </div>
      </div>
      <form class="profile-editor" id="profile-editor" hidden>
        <label for="profile-name-input">이름</label>
        <input id="profile-name-input" name="name" maxlength="60" required>
        <label for="profile-status-input">상태 메시지</label>
        <input id="profile-status-input" name="status" maxlength="120">
        <label for="profile-image-url-input">프로필 사진 링크</label>
        <input id="profile-image-url-input" name="imageUrl" type="url" maxlength="2000" placeholder="https://example.com/photo.jpg">
        <img class="profile-image-preview" id="profile-image-preview" alt="프로필 사진 미리보기" hidden>
        <label for="profile-info-input">소개 (줄바꿈 가능)</label>
        <textarea id="profile-info-input" name="info" maxlength="500"></textarea>
        <div class="profile-editor-actions">
          <button type="submit">프로필 저장</button>
          <button type="button" id="profile-edit-cancel">취소</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- ── 시계 윈도우 ── -->
<div class="win open" id="win-clock">
  <div class="win-title" data-win="win-clock">
    <span class="win-label">
      <img class="px-icon" src="assets/icons/A_hourglass.png" alt="">현재 시각
    </span>
    <div class="win-btns">
      <button class="tbtn" onclick="minimizeWin('win-clock')">_</button>
      <button class="tbtn">□</button>
      <button class="tbtn" onclick="closeWin('win-clock')">×</button>
    </div>
  </div>
  <div class="win-body">
    <div id="clock">00:00:00</div>
    <div id="date-disp"></div>
  </div>
</div>

<!-- ── 홈 윈도우 ── -->
<div class="win open" id="win-welcome">
  <div class="win-title" data-win="win-welcome">
    <span class="win-label">🏠 홈</span>
    <div class="win-btns">
      <button class="tbtn" onclick="minimizeWin('win-welcome')">_</button>
      <button class="tbtn">□</button>
      <button class="tbtn" onclick="closeWin('win-welcome')">×</button>
    </div>
  </div>
  <div class="win-menubar">
    <div class="menu">
      <button class="mitem" id="welcome-file-menu" type="button">파일(F)</button>
      <div class="menu-dropdown" id="welcome-file-dropdown" hidden>
        <button id="welcome-edit" type="button" hidden>편집(E)</button>
      </div>
    </div>
    <span class="mitem">보기(V)</span>
    <span class="mitem">도움말(H)</span>
  </div>
  <div class="win-body">

<script>
// ── 윈도우 메타 ──
const WIN_META = {
  'win-profile': { label: '🌸 프로필' },
  'win-clock':   { label: '⏰ 현재 시각' },
  'win-welcome': { label: '🏠 홈' },
  'win-diary':   { label: '📔 다이어리' },
};
const OPEN_WINS = new Set();  // currently open (not minimized) windows
const EXIST_WINS = new Set(); // windows that haven't been closed

// Use the supplied mouse-click recordings and vary them for a less repetitive feel.
const clickSounds = ['click1.mp3', 'click2.mp3', 'click3.mp3'].map(file => {
  const sound = new Audio(`assets/sounds/${file}`);
  sound.preload = 'auto';
  sound.volume = 0.5;
  return sound;
});
let previousClickSound = -1;
function playMouseClick() {
  let soundIndex = Math.floor(Math.random() * clickSounds.length);
  if (clickSounds.length > 1 && soundIndex === previousClickSound) {
    soundIndex = (soundIndex + 1) % clickSounds.length;
  }
  previousClickSound = soundIndex;
  const sound = clickSounds[soundIndex];
  sound.currentTime = 0;
  sound.play().catch(() => {});
}

document.addEventListener('pointerdown', event => {
  if (event.button === 0 && event.isPrimary) playMouseClick();
}, { passive: true });

// ── 로딩 바 ──
let pct = 0;
const barEl  = document.getElementById('load-bar');
const pctEl  = document.getElementById('load-pct');
const loadIv = setInterval(() => {
  pct = Math.min(100, pct + Math.floor(Math.random() * 9) + 3);
  barEl.style.width = pct + '%';
  pctEl.textContent = pct + '%';
  if (pct >= 100) {
    clearInterval(loadIv);
    setTimeout(() => {
      const ol = document.getElementById('loading-overlay');
      ol.classList.add('hidden');
      setTimeout(() => ol.remove(), 600);
    }, 350);
  }
}, 80);

// ── z-index 관리 ──
let zTop = 10;
function focusWin(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.style.zIndex = ++zTop;
  updateTaskbar();
}

// ── 윈도우 열기 ──
function openWin(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.add('open');
  el.style.display = 'block';
  OPEN_WINS.add(id);
  EXIST_WINS.add(id);
  focusWin(id);
}

// ── 닫기 (완전히 숨김) ──
function closeWin(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.remove('open');
  el.style.display = 'none';
  OPEN_WINS.delete(id);
  EXIST_WINS.delete(id);
  updateTaskbar();
}

// ── 최소화 (taskbar로) ──
function minimizeWin(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.style.display = 'none';
  OPEN_WINS.delete(id);
  updateTaskbar();
}

// ── 태스크바 업데이트 ──
function updateTaskbar() {
  const container = document.getElementById('tb-wins');
  container.innerHTML = '';
  EXIST_WINS.forEach(id => {
    const btn = document.createElement('button');
    btn.className = 'tb-win' + (document.getElementById(id).style.display !== 'none' ? ' active' : '');
    btn.textContent = WIN_META[id]?.label || id;
    btn.onclick = () => {
      const el = document.getElementById(id);
      if (el.style.display === 'none') {
        el.style.display = 'block';
        OPEN_WINS.add(id);
        focusWin(id);
      } else {
        focusWin(id);
      }
      updateTaskbar();
    };
    container.appendChild(btn);
  });
}

// ── 데스크탑 아이콘 클릭 ──
let selectedIco = null;
function icoClick(el, winId) {
  if (selectedIco) selectedIco.classList.remove('active');
  el.classList.add('active');
  selectedIco = el;
  if (winId) {
    const win = document.getElementById(winId);
    if (!win) return;
    EXIST_WINS.add(winId);
    win.style.display = 'block';
    OPEN_WINS.add(winId);
    focusWin(winId);
  } else {
    showToast('공사중이에요! ♡');
  }
}
document.addEventListener('click', e => {
  if (!e.target.closest('.desktop-icon') && selectedIco) {
    selectedIco.classList.remove('active');
    selectedIco = null;
  }
});

// ── 토스트 ──
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

// ── 드래그 ──
let dragEl = null, dox = 0, doy = 0;
document.querySelectorAll('.win-title').forEach(tb => {
  tb.addEventListener('mousedown', e => {
    if (e.target.classList.contains('tbtn')) return;
    const win = tb.closest('.win');
    dragEl = win;
    focusWin(win.id);
    const r = win.getBoundingClientRect();
    dox = e.clientX - r.left;
    doy = e.clientY - r.top;
  });
});
// 윈도우 클릭 시 focus
document.querySelectorAll('.win').forEach(win => {
  win.addEventListener('mousedown', e => {
    if (!e.target.classList.contains('tbtn')) focusWin(win.id);
  });
});

// ── 커서 + 드래그 + 스파클 ──
const cur   = document.getElementById('cursor');
const chars = ['✿','★','♡','✦','♪','✶'];
const cols  = ['#e8547a','#ff8fab','#ffb3c6','#c45a7a','#ff6b9d'];

document.addEventListener('mousemove', e => {
  cur.style.left = e.clientX + 'px';
  cur.style.top  = e.clientY + 'px';
  if (dragEl) {
    dragEl.style.left = (e.clientX - dox) + 'px';
    dragEl.style.top  = (e.clientY - doy) + 'px';
    return;
  }
  if (Math.random() < 0.15) spark(e.clientX, e.clientY);
});
document.addEventListener('mouseup', () => { dragEl = null; });

function spark(x, y) {
  const el = document.createElement('div');
  el.className = 'sparkle';
  el.textContent = chars[Math.floor(Math.random() * chars.length)];
  el.style.left  = (x + (Math.random() - 0.5) * 20) + 'px';
  el.style.top   = (y + (Math.random() - 0.5) * 20) + 'px';
  el.style.color = cols[Math.floor(Math.random() * cols.length)];
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 700);
}

// ── 시계 ──
const DAYS = ['일','월','화','수','목','금','토'];
function tick() {
  const n = new Date(), p = v => String(v).padStart(2, '0');
  document.getElementById('clock').textContent =
    `${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;
  document.getElementById('date-disp').textContent =
    `${n.getFullYear()}.${p(n.getMonth()+1)}.${p(n.getDate())} (${DAYS[n.getDay()]})`;
  document.getElementById('taskbar-clock').textContent =
    `${p(n.getHours())}:${p(n.getMinutes())}`;
}
setInterval(tick, 1000); tick();

// ── 초기 위치 설정 ──
window.addEventListener('load', () => {
  const W = innerWidth, H = innerHeight;
  const setPos = (id, x, y) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.style.left = Math.max(0, x) + 'px';
    el.style.top  = Math.max(0, y) + 'px';
  };

  // 처음에 열려있는 윈도우들
  ['win-profile','win-clock','win-welcome'].forEach(id => EXIST_WINS.add(id));
  ['win-profile','win-clock','win-welcome'].forEach(id => OPEN_WINS.add(id));

  // 위치
  setPos('win-profile', 100, 48);
  setPos('win-clock',   100, 290);

  const wel = document.getElementById('win-welcome');
  setPos('win-welcome', (W - wel.offsetWidth) / 2, 48);

  const dia = document.getElementById('win-diary');
  setPos('win-diary', (W - dia.offsetWidth) / 2 + 30, 90);

  // 초기 z-index
  document.getElementById('win-profile').style.zIndex = 11;
  document.getElementById('win-clock').style.zIndex   = 12;
  document.getElementById('win-welcome').style.zIndex  = 13;

  updateTaskbar();
});
</script>
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js';
  import { GoogleAuthProvider, getAuth, onAuthStateChanged, signInWithPopup, signOut } from 'https://www.gstatic.com/firebasejs/12.9.0/firebase-auth.js';
  import { collection, doc, getDoc, getFirestore, onSnapshot, serverTimestamp, setDoc } from 'https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js';
  import { firebaseConfig } from './firebase-config.js';

  const defaults = {
    name: '홈피 주인',

  const diaryAddButton = document.getElementById('diary-add');

  const diaryCalendarMonth = document.getElementById('diary-calendar-month');
  const diaryCalendarDays = document.getElementById('diary-calendar-days');

  let db;
  let auth;
  let isAdmin = false;
  let diaryEntries = new Map();
  let selectedDiaryDate = formatDiaryDate(new Date());
  let calendarMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1);

  function getSafeImageUrl(value) {
    const url = String(value || '').trim();
    if (!url) return '';
    try {
      const parsed = new URL(url);
      return ['http:', 'https:'].includes(parsed.protocol) ? parsed.href : '';
    } catch {
      return '';
    }
  }

  function updateImagePreview(value) {
    const imageUrl = getSafeImageUrl(value);
    imagePreview.hidden = !imageUrl;
    if (imageUrl) imagePreview.src = imageUrl;
    else imagePreview.removeAttribute('src');
  }

  function updateProfileImage(value) {
    const imageUrl = getSafeImageUrl(value);
    avatarImage.hidden = !imageUrl;
    avatarFallback.hidden = Boolean(imageUrl);
    if (imageUrl) avatarImage.src = imageUrl;
    else avatarImage.removeAttribute('src');
    updateImagePreview(imageUrl);
  }

  function renderProfile(data = defaults) {
    const profile = { ...defaults, ...data };
    nameEl.textContent = profile.name;
    statusEl.textContent = profile.status;
    infoEl.replaceChildren();
    profile.info.split('\n').forEach((line, index) => {

    editor.elements.name.value = profile.name;
    editor.elements.status.value = profile.status;

  function renderWelcome(data = welcomeDefaults) {
    const welcome = { ...welcomeDefaults, ...data };
    welcomeTitleEl.textContent = welcome.title;
    welcomeMessageEl.replaceChildren();
    welcome.message.split('\n').forEach((line, index) => {
      if (index) welcomeMessageEl.append(document.createElement('br'));
      welcomeMessageEl.append(document.createTextNode(line));
    });
    welcomeEditor.elements.title.value = welcome.title;
    welcomeEditor.elements.message.value = welcome.message;
  }

  function formatDiaryDate(date) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  function parseDiaryDate(value) {
    const [year, month, day] = value.split('-').map(Number);
    return new Date(year, month - 1, day);
  }

  function renderDiary() {
    const selected = parseDiaryDate(selectedDiaryDate);
    const entry = diaryEntries.get(selectedDiaryDate);
    const weekdays = ['일', '월', '화', '수', '목', '금', '토'];
    diaryDateEl.textContent = `${selected.getFullYear()}.${String(selected.getMonth() + 1).padStart(2, '0')}.${String(selected.getDate()).padStart(2, '0')} (${weekdays[selected.getDay()]})${entry?.mood ? ` · ${entry.mood}` : ''}`;
    diaryBodyEl.replaceChildren();
    if (!entry) {
      const empty = document.createElement('p');
      empty.className = 'diary-empty';
      empty.textContent = '이 날짜에는 아직 작성된 다이어리가 없어요.';
      diaryBodyEl.append(empty);
    } else {
      if (entry.title) {
        const title = document.createElement('strong');
        title.textContent = entry.title;
        diaryBodyEl.append(title, document.createElement('br'));
      }
      entry.content.split('\n').forEach((line, index) => {
        if (index) diaryBodyEl.append(document.createElement('br'));
        diaryBodyEl.append(document.createTextNode(line));
      });
    }
    renderDiaryCalendar();
  }

  function renderDiaryCalendar() {
    const year = calendarMonth.getFullYear();
    const month = calendarMonth.getMonth();
    diaryCalendarMonth.textContent = `${year}.${String(month + 1).padStart(2, '0')}`;
    diaryCalendarDays.replaceChildren();
    const firstDay = new Date(year, month, 1).getDay();
    const lastDate = new Date(year, month + 1, 0).getDate();
    for (let index = 0; index < firstDay + lastDate; index += 1) {
      if (index < firstDay) {
        const blank = document.createElement('span');
        blank.className = 'diary-calendar-day muted';
        diaryCalendarDays.append(blank);
        continue;
      }
      const day = index - firstDay + 1;
      const date = formatDiaryDate(new Date(year, month, day));
      const button = document.createElement('button');
      button.type = 'button';
      button.className = `diary-calendar-day${date === selectedDiaryDate ? ' selected' : ''}${diaryEntries.has(date) ? ' has-entry' : ''}`;
      button.textContent = day;
      button.setAttribute('aria-label', `${date}${diaryEntries.has(date) ? ', 작성된 다이어리 있음' : ''}`);
      button.addEventListener('click', () => {
        selectedDiaryDate = date;
        diaryEditor.hidden = true;
        renderDiary();
      });
      diaryCalendarDays.append(button);
    }
  }

  function openDiaryEditor(mode) {
    if (!isAdmin) return;
    const entry = mode === 'edit' ? diaryEntries.get(selectedDiaryDate) : null;

    diaryEditor.dataset.mode = mode;
    diaryEditor.elements.date.disabled = mode === 'edit';
    diaryEditor.elements.date.value = selectedDiaryDate;
    diaryEditor.elements.mood.value = entry?.mood || '';
    diaryEditor.elements.title.value = entry?.title || '';
    diaryEditor.elements.content.value = entry?.content || '';
    diaryEditor.hidden = false;
  }

  function setEditorOpen(open) {
    editor.hidden = !open;
    profileWindow.classList.toggle('editing', open);
  }

  function showEditor(show) {
    isAdmin = show;
    editButton.hidden = !show;
    welcomeEditButton.hidden = !show;
    diaryAddButton.hidden = !show;
    diaryEditButton.hidden = !show;
    if (!show) {
      setEditorOpen(false);
      welcomeEditor.hidden = true;
      diaryEditor.hidden = true;
    }
  }

  async function setAdminState(user) {
    showEditor(false);
    if (!user) {
      adminLoginLabel.textContent = '관리자 로그인';
      adminLoginButton.title = 'Google로 관리자 로그인';
      authStatus.hidden = true;
      return;
    }
    authStatus.hidden = false;
    adminLoginLabel.textContent = '로그아웃';
    adminLoginButton.title = '로그아웃';
    authStatus.textContent = '관리자 권한을 확인하는 중...';
    try {
      const admin = await getDoc(doc(db, 'admins', user.uid));
      if (admin.exists() && admin.data().enabled === true) {
        showEditor(true);
        authStatus.textContent = `${user.email || user.uid} · 관리자`;
      } else {
        authStatus.textContent = `${user.email || user.uid} · 읽기 전용`;
      }
    } catch (error) {
      authStatus.textContent = '관리자 권한을 확인할 수 없습니다.';
      console.error(error);
    }
  }

  async function startFirebase() {
    if (!firebaseConfig || firebaseConfig.apiKey === 'PASTE_YOUR_API_KEY') {
      authStatus.textContent = 'Firebase 설정 후 프로필을 연결할 수 있습니다.';
      return;
    }
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);
    auth = getAuth(app);
    onSnapshot(doc(db, 'siteContent', 'profile'), (snapshot) => renderProfile(snapshot.data()), (error) => {
      authStatus.textContent = '프로필을 불러오지 못했습니다.';
      console.error(error);
    });
    onSnapshot(doc(db, 'siteContent', 'welcome'), (snapshot) => renderWelcome(snapshot.data()), (error) => {
      console.error('홈 문구를 불러오지 못했습니다.', error);
    });
    onSnapshot(collection(db, 'diaryEntries'), (snapshot) => {
      diaryEntries = new Map(snapshot.docs.map((entry) => [entry.id, entry.data()]));
      renderDiary();
    }, (error) => {
      console.error('다이어리를 불러오지 못했습니다.', error);
    });
    onAuthStateChanged(auth, setAdminState);
  }

  adminLoginButton.addEventListener('click', async () => {
    if (!auth) return;
    startMenu.hidden = true;
    if (auth.currentUser) {
      await signOut(auth);
      return;
    }
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch (error) { authStatus.textContent = 'Google 로그인에 실패했습니다.'; console.error(error); }
  });
  imageUrlInput.addEventListener('input', () => updateImagePreview(imageUrlInput.value));
  avatarImage.addEventListener('error', () => {
    avatarImage.hidden = true;
    avatarFallback.hidden = false;
  });
  imagePreview.addEventListener('error', () => { imagePreview.hidden = true; });
  startMenuToggle.addEventListener('click', () => {
    startMenu.hidden = !startMenu.hidden;
  });
  document.addEventListener('click', (event) => {
    if (!event.target.closest('#start-menu, #start-menu-toggle')) startMenu.hidden = true;
  });
  editButton.addEventListener('click', () => {
    if (isAdmin) setEditorOpen(true);
  });
  cancelEditButton.addEventListener('click', () => setEditorOpen(false));
  welcomeFileMenu.addEventListener('click', () => {
    if (welcomeEditButton.hidden) {
      welcomeFileDropdown.hidden = true;
      window.showToast('관리자 로그인 후 편집할 수 있어요.');
      return;
    }
    welcomeFileDropdown.hidden = !welcomeFileDropdown.hidden;
  });
  document.addEventListener('click', (event) => {
    if (!event.target.closest('.menu')) welcomeFileDropdown.hidden = true;
  });
  welcomeEditButton.addEventListener('click', () => {
    welcomeFileDropdown.hidden = true;
    if (!isAdmin) {
      window.showToast('관리자 로그인 후 편집할 수 있어요.');
      return;
    }
    welcomeEditor.hidden = false;
  });
  welcomeEditCancelButton.addEventListener('click', () => { welcomeEditor.hidden = true; });
  diaryFileMenu.addEventListener('click', () => {
    if (diaryAddButton.hidden) {
      diaryFileDropdown.hidden = true;
      window.showToast('관리자 로그인 후 추가할 수 있어요.');
      return;
    }
    diaryFileDropdown.hidden = !diaryFileDropdown.hidden;
  });
  document.addEventListener('click', (event) => {
    if (!event.target.closest('#diary-file-menu, #diary-file-dropdown')) diaryFileDropdown.hidden = true;
  });
  diaryAddButton.addEventListener('click', () => {
    diaryFileDropdown.hidden = true;
    openDiaryEditor('add');
  });
  diaryEditButton.addEventListener('click', () => {
    openDiaryEditor('edit');
  });
  diaryEditCancelButton.addEventListener('click', () => { diaryEditor.hidden = true; });
  editor.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (!isAdmin) return;
    const form = new FormData(editor);
    const rawImageUrl = form.get('imageUrl');
    const imageUrl = getSafeImageUrl(rawImageUrl);
    if (String(rawImageUrl).trim() && !imageUrl) {
      authStatus.hidden = false;
      authStatus.textContent = 'http 또는 https 사진 링크를 입력하세요.';
      return;
    }
    const profile = {
      name: form.get('name').trim(), status: form.get('status').trim(), imageUrl, info: form.get('info').trim(),
      updatedAt: serverTimestamp(),
    };
    try {
      await setDoc(doc(db, 'siteContent', 'profile'), profile, { merge: true });
      authStatus.textContent = '프로필을 저장했습니다.';
      setEditorOpen(false);
    } catch (error) {
      authStatus.textContent = '저장하지 못했습니다. 관리자 설정을 확인하세요.';
      console.error(error);
    }
  });
  welcomeEditor.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (!isAdmin || !db) return;
    const form = new FormData(welcomeEditor);
    const welcome = {
      title: form.get('title').trim(),
      message: form.get('message').trim(),
      updatedAt: serverTimestamp(),
    };
    try {
      await setDoc(doc(db, 'siteContent', 'welcome'), welcome, { merge: true });
      renderWelcome(welcome);
      welcomeEditor.hidden = true;
      window.showToast('홈 문구를 저장했습니다.');
    } catch (error) {
      window.showToast('홈 문구를 저장하지 못했습니다.');
      console.error(error);
    }
  });
  diaryEditor.addEventListener('submit', async (event) => {
    event.preventDefault();
    if (!isAdmin || !db) return;
    const form = new FormData(diaryEditor);
    const date = diaryEditor.elements.date.disabled ? selectedDiaryDate : String(form.get('date'));
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
    if (diaryEditor.dataset.mode === 'add' && diaryEntries.has(date)) {
      window.showToast('이미 작성된 날짜예요. 편집 메뉴를 사용하세요.');
      return;
    }
    const entry = {
      title: String(form.get('title')).trim(),
      content: String(form.get('content')).trim(),
      mood: String(form.get('mood')).trim(),
      updatedAt: serverTimestamp(),
    };
    const previousEntry = diaryEntries.get(date);
    diaryEntries.set(date, { ...previousEntry, ...entry });
    selectedDiaryDate = date;
    calendarMonth = new Date(parseDiaryDate(date).getFullYear(), parseDiaryDate(date).getMonth(), 1);
    diaryEditor.hidden = true;
    renderDiary();
    try {
      await setDoc(doc(db, 'diaryEntries', date), entry, { merge: true });
      window.showToast('다이어리를 저장했습니다.');
    } catch (error) {
      if (previousEntry) diaryEntries.set(date, previousEntry);
      else diaryEntries.delete(date);
      renderDiary();
      window.showToast('다이어리를 저장하지 못했습니다. 관리자 설정을 확인하세요.');
      console.error(error);
    }
  });
  renderProfile();
  renderWelcome();
  renderDiary();
  startFirebase();
</script>
</body>
</html>
