name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out private board source
        uses: actions/checkout@v4
        with:
          repository: flosnidor9/myweb-private
          token: ${{ secrets.MYWEB_PRIVATE_REPO_TOKEN }}
          path: .private-board-source
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          BOARD_CONTENT_MASTER_KEY: ${{ secrets.BOARD_CONTENT_MASTER_KEY }}
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm ci && npm run build

      - name: Remove private board source
        run: rm -rf .private-board-source

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
